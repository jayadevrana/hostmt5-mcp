[project]
name = "hostmt5-mcp"
version = "1.0.0"
description = "MCP server for MetaTrader 5: let Claude, ChatGPT desktop or Cursor work with your MT5 accounts hosted on HostMT5"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]
keywords = ["mcp", "metatrader5", "mt5", "trading", "expert-advisor", "copy-trading", "claude"]

[project.urls]
Homepage = "https://hostmt5.com"
Guide = "https://hostmt5.com/learn/mt5-ai-assistant-mcp"

[project.scripts]
hostmt5-mcp = "hostmt5_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hostmt5_mcp"]
