[project]
name = "hostmt5-mcp"
version = "2.0.0"
description = "MCP server for MetaTrader 5: stdio bridge to the HostMT5 remote MCP server, so Claude, ChatGPT, Cursor and other AI apps can work with MT5 accounts hosted on HostMT5"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["mcp", "metatrader5", "mt5", "trading", "expert-advisor", "copy-trading", "claude"]

[project.urls]
Homepage = "https://hostmt5.com"
Documentation = "https://hostmt5.com/docs#mcp"
Guide = "https://hostmt5.com/learn/mt5-ai-assistant-mcp"

[project.scripts]
hostmt5-mcp = "hostmt5_mcp:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hostmt5_mcp"]
